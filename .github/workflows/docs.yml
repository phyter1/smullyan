name: Docs

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Read by default; the deploy job escalates only what Pages needs.
permissions:
  contents: read

# Never cancel an in-flight deployment — a cancelled Pages deploy can leave the
# site on a half-published state. PR builds are cancellable because they only
# verify.
concurrency:
  group: docs-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    name: Build docs
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # lastUpdated: true in the VitePress config reads git history for each
          # page. A shallow clone silently yields wrong or missing timestamps.
          fetch-depth: 0
          persist-credentials: false

      - name: Setup pnpm + Node
        id: setup
        # continue-on-error so a failed download does not end the job; the retry
        # below reruns the action. GitHub Actions has no step-level retry and an
        # action cannot be wrapped in a shell loop, so this is the only way to
        # retry a `uses:` step.
        continue-on-error: true
        uses: pnpm/setup@c9883cc79df532ad1a7b81bf9ab944ceb090d65c # v2.0.0
        with:
          runtime: node@24
          cache: true
          install: false

      # GitHub's release CDN — where BOTH the pnpm binary and the gitleaks
      # binary come from — has been returning ECONNRESET and 503 intermittently,
      # failing jobs before any project code runs. Two attempts were not enough:
      # separate jobs lost both on two occasions.
      #
      # Three attempts with backoff between them. Retrying an overloaded CDN
      # immediately is close to useless, so the waits matter more than the extra
      # attempt does.
      - name: Wait before retrying setup
        if: steps.setup.outcome == 'failure'
        run: sleep 15

      - name: Setup pnpm + Node (retry 1)
        id: setup2
        if: steps.setup.outcome == 'failure'
        continue-on-error: true
        uses: pnpm/setup@c9883cc79df532ad1a7b81bf9ab944ceb090d65c # v2.0.0
        with:
          runtime: node@24
          cache: true
          install: false

      - name: Wait before final setup attempt
        if: steps.setup.outcome == 'failure' && steps.setup2.outcome == 'failure'
        run: sleep 30

      # No continue-on-error. If this fails the job fails, so a genuinely broken
      # setup can never be mistaken for a passing build. A retry that cannot
      # still fail is suppression with extra steps.
      - name: Setup pnpm + Node (retry 2)
        if: steps.setup.outcome == 'failure' && steps.setup2.outcome == 'failure'
        uses: pnpm/setup@c9883cc79df532ad1a7b81bf9ab944ceb090d65c # v2.0.0
        with:
          runtime: node@24
          cache: true
          install: false

      - name: Install
        # A transient ECONNRESET from the registry failed this PR's Quality job
        # twice while every other job passed. GitHub Actions has no step-level
        # retry, so this does it explicitly. --frozen-lockfile is preserved, so
        # a retry can never mask a genuinely out-of-date lockfile.
        run: |
          for attempt in 1 2 3; do
            if pnpm install --frozen-lockfile; then exit 0; fi
            echo "::warning::pnpm install attempt $attempt failed; retrying" >&2
            sleep $((attempt * 5))
          done
          echo "::error::pnpm install failed after 3 attempts" >&2
          exit 1

      # docs:build regenerates the API reference and aviary from source first,
      # so a stale generated file cannot be published. VitePress is configured
      # with ignoreDeadLinks: false, so a broken internal link fails here.
      - name: Build site
        run: pnpm run docs:build

      - name: Configure Pages
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      - name: Upload artifact
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: docs/.vitepress/dist

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      pages: write # publish the site
      id-token: write # the deployment is attested via OIDC
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5.0.0
