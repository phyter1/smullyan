name: Security

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Weekly full re-scan so newly disclosed CVEs surface without a commit.
    - cron: '17 4 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: security-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  gitleaks:
    name: Secret scan (gitleaks)
    runs-on: ubuntu-latest
    permissions:
      # Only read is needed because PR commenting is disabled below. Leaving
      # comments on would require pull-requests: write.
      contents: read
    steps:
      - name: Checkout full history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # A secret is only "leaked" once it exists in ANY reachable commit.
          # Shallow clones make gitleaks structurally incapable of finding it.
          fetch-depth: 0
          persist-credentials: false

      # The MIT gitleaks CLI, downloaded at a pinned version and checksum-verified.
      # Deliberately NOT gitleaks/gitleaks-action: that action has been
      # PROPRIETARY since v2.0.0 and is free only under a personal account. It
      # would hard-fail without a paid GITLEAKS_LICENSE the day this repo moved
      # under an organization — and a non-OSS dependency sits badly in a project
      # whose pitch is supply-chain hygiene.
      - name: Install gitleaks (pinned + checksum-verified)
        env:
          GITLEAKS_VERSION: '8.30.1'
          GITLEAKS_SHA256: '551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb'
        run: |
          set -euo pipefail
          TARBALL="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -fsSL --retry 3 -o "$TARBALL" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/${TARBALL}"
          echo "${GITLEAKS_SHA256}  ${TARBALL}" | sha256sum --check --status
          tar -xzf "$TARBALL" gitleaks
          sudo install -m 0755 gitleaks /usr/local/bin/gitleaks
          rm -f "$TARBALL" gitleaks
          gitleaks version

      # `gitleaks git` scans reachable history; fetch-depth: 0 above is what
      # makes that meaningful. --exit-code 1 is what makes this a gate.
      - name: Run gitleaks
        run: gitleaks git --redact --no-banner --exit-code 1 --report-format sarif --report-path gitleaks.sarif .

      - name: Upload gitleaks report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: gitleaks-report
          path: gitleaks.sarif
          retention-days: 7

  osv-scan-pr:
    name: OSV-Scanner (PR diff)
    if: ${{ github.event_name == 'pull_request' }}
    permissions:
      # security-events: write is required to publish SARIF to Code scanning.
      # actions: read is required by codeql-action/upload-sarif to correlate the
      # run — see github/codeql-action#2117.
      actions: read
      contents: read
      security-events: write
    uses: google/osv-scanner-action/.github/workflows/osv-scanner-reusable-pr.yml@9a498708959aeaef5ef730655706c5a1df1edbc2 # v2.3.8
    with:
      scan-args: |-
        --recursive
        ./

  osv-scan-full:
    name: OSV-Scanner (full)
    if: ${{ github.event_name != 'pull_request' }}
    permissions:
      actions: read
      contents: read
      security-events: write
    uses: google/osv-scanner-action/.github/workflows/osv-scanner-reusable.yml@9a498708959aeaef5ef730655706c5a1df1edbc2 # v2.3.8
    with:
      scan-args: |-
        --recursive
        ./

  dependency-review:
    name: Dependency review
    if: ${{ github.event_name == 'pull_request' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Review dependency changes
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: high
          # smullyan is MIT and has no runtime dependencies; reject anything
          # that would contaminate the licence story.
          deny-licenses: AGPL-1.0-or-later, AGPL-3.0-or-later, GPL-2.0-or-later, GPL-3.0-or-later, LGPL-3.0-or-later
          # Not set: comment-summary-in-pr, which would require pull-requests: write.

  snyk:
    name: Snyk (auto-skips without SNYK_TOKEN)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # Needed only for the SARIF upload step.
      security-events: write
    steps:
      # The `secrets` context is NOT available in `jobs.<id>.if` (allowed there:
      # github, needs, vars, inputs). It IS available in `steps.<id>.env`. So the
      # only correct fail-soft pattern is to probe the secret inside a step and
      # gate every later step on that step's output. This also means forked-PR
      # runs — where secrets are always empty — skip cleanly instead of erroring.
      - name: Probe for SNYK_TOKEN
        id: probe
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        run: |
          if [ -n "${SNYK_TOKEN}" ]; then
            echo 'present=true' >> "$GITHUB_OUTPUT"
            echo '::notice title=Snyk::SNYK_TOKEN found, running Snyk scan.'
          else
            echo 'present=false' >> "$GITHUB_OUTPUT"
            echo '::notice title=Snyk skipped::No SNYK_TOKEN secret is configured. Add one in Settings > Secrets and variables > Actions to enable this scan; no workflow change is needed.'
          fi

      - name: Checkout
        if: ${{ steps.probe.outputs.present == 'true' }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup pnpm + Node and install
        if: ${{ steps.probe.outputs.present == 'true' }}
        uses: pnpm/setup@c9883cc79df532ad1a7b81bf9ab944ceb090d65c # v2.0.0
        with:
          runtime: node@24
          cache: true

      # snyk/actions/setup installs the CLI onto the runner. Preferred over the
      # snyk/actions/node Docker action, whose image has no pnpm and cannot see
      # a pnpm-installed node_modules tree.
      - name: Install Snyk CLI
        if: ${{ steps.probe.outputs.present == 'true' }}
        uses: snyk/actions/setup@9adf32b1121593767fc3c057af55b55db032dc04 # v1.0.0

      - name: Snyk test
        if: ${{ steps.probe.outputs.present == 'true' }}
        # Non-blocking so the SARIF still uploads and a third-party outage never
        # wedges the merge queue. Findings surface in the Security tab.
        continue-on-error: true
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        run: snyk test --all-projects --severity-threshold=high --sarif-file-output=snyk.sarif

      - name: Upload Snyk SARIF
        if: ${{ steps.probe.outputs.present == 'true' && hashFiles('snyk.sarif') != '' }}
        uses: github/codeql-action/upload-sarif@5595ccaf912efad79be6eef63a5619ff05969be3 # v4.37.6
        with:
          sarif_file: snyk.sarif
          category: snyk
